name: Setup Python and Poetry
description: Installs Python, Poetry (version from .poetry-version) and the project with the dev group

inputs:
  python-version:
    description: Python version to use
    required: true

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Setup Poetry
      # pipx is preinstalled on the GitHub runners; the version is pinned by the file, no installer script is downloaded.
      run: pipx install "poetry==$(cat .poetry-version)"
      shell: bash

    - name: Install dependencies
      run: poetry install
      shell: bash
