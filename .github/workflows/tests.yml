name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}

      - name: Format
        run: poetry run ruff format --check .

      - name: Lint
        run: poetry run ruff check .

      - name: Types
        run: poetry run pyright lido_safe_logging tests

      - name: Tests
        run: poetry run pytest

      - name: Build
        run: poetry build

      - name: No runtime dependencies in the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob('dist/*.whl')[0]
          with zipfile.ZipFile(wheel) as archive:
              metadata = next(name for name in archive.namelist() if name.endswith('METADATA'))
              lines = archive.read(metadata).decode().splitlines()
          forbidden = [line for line in lines if line.startswith(('Requires-Dist:', 'Provides-Extra:'))]
          assert not forbidden, f'{wheel} declares dependencies: {forbidden}'
          print(f'{wheel}: no runtime dependencies')
          PY
