name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match the environment of the trusted publisher on PyPI.
    environment: release
    permissions:
      contents: read
      # PyPI trusted publishing (the OIDC token replaces an API token) and the Sigstore signing of the attestations.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup
        with:
          python-version: '3.12'

      - name: Check the tag matches the version
        # The releases are tagged v<version>, as v0.1.3 for version = "0.1.3" in pyproject.toml.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(poetry version -s)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::The release tag $TAG does not match the version $version in pyproject.toml"
            exit 1
          fi

      - name: Build
        run: poetry build --no-interaction

      - name: Install the publish tools
        # Release-only tools, in their own venv outside the lock file: the package must keep no runtime dependencies.
        # Poetry cannot upload attestations, twine can.
        run: |
          python -m venv "$RUNNER_TEMP/publish"
          "$RUNNER_TEMP/publish/bin/pip" install --quiet "pypi-attestations==0.0.30" "twine==7.0.0"

      - name: Sign the distributions
        # PEP 740 attestations, signed by Sigstore with the OIDC identity of this job (the same workflow and
        # environment as the trusted publisher). Writes dist/<file>.publish.attestation next to every file.
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/publish/bin/python" -m pypi_attestations sign dist/*.whl dist/*.tar.gz
          ls -l dist/

      - name: Publish to PyPI
        run: |
          TWINE_PASSWORD=$(.github/scripts/pypi_oidc_token.sh pypi.org)
          export TWINE_PASSWORD TWINE_USERNAME=__token__
          "$RUNNER_TEMP/publish/bin/twine" upload --non-interactive --attestations dist/*
