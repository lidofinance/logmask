[project]
name = "logmask"
version = "0.1.4"
description = "JSON logging with masked secrets for Python services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Lido" }]
requires-python = ">=3.12,<4"
# Hard rule: no runtime dependencies. Tools for tests, lint and types go to the dev group only.
dependencies = []

[project.urls]
Repository = "https://github.com/lidofinance/logmask"
Changelog = "https://github.com/lidofinance/logmask/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{ include = "logmask" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
ruff = "^0.17"
pyright = "^1.1"
structlog = ">=24.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.pyright]
include = ["logmask", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["logmask"]
pytest_add_cli_args_test_selection = ["tests"]
